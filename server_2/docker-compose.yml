# Full stack (identity + catalog + commerce + fulfillment + engagement):
# API + two workers + Mongo (replica set, required for outbox/cross-context
# transactions) + Redis (sessions/OTP/BullMQ).
#
# Phase 8: three worker services collapsed to two, matching the two queues.
#   worker-relay — drains the outbox (`OrderRequested` → CreateFulfillment), no BullMQ consumer.
#   worker-jobs  — one BullMQ Worker per queue (email-queue, fulfillment-queue) in one process.
# Both call bootstrapWorker() → both need MONGO_URI and the initialized replica set (mongo-init).
# (worker-jobs needs Mongo where the old worker-email did not: it now also runs the fulfillment
# timeout jobs, whose use cases read and write the fulfillment aggregate.)

services:
  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: mongosh --quiet --eval 'db.runCommand("ping").ok'
      interval: 5s
      timeout: 5s
      retries: 10

  mongo-init:
    image: mongo:7
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    entrypoint:
      - bash
      - -c
      - >
        mongosh --host mongo:27017 --quiet --eval
        'try { rs.status().ok } catch (e) { rs.initiate({_id: "rs0", members: [{ _id: 0, host: "mongo:27017" }]}) }'

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      MONGO_URI: mongodb://mongo:27017/flavorstack?replicaSet=rs0
      REDIS_HOST: redis
    ports:
      - "3000:3000"
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
    healthcheck:
      # `/health` is 503 unless both Mongo and Redis answer, and wget fails on a 5xx —
      # so this probes readiness, not just "the port is open". The workers deliberately
      # do NOT depend_on it: they never call the API, and gating them would only slow boot.
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  worker-relay:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file: .env
    environment:
      WORKER_TYPE: relay
      MONGO_URI: mongodb://mongo:27017/flavorstack?replicaSet=rs0
      REDIS_HOST: redis
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
    restart: unless-stopped

  worker-jobs:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file: .env
    environment:
      WORKER_TYPE: jobs
      MONGO_URI: mongodb://mongo:27017/flavorstack?replicaSet=rs0
      REDIS_HOST: redis
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
    restart: unless-stopped

volumes:
  mongo-data:
  redis-data:
