# Full stack (identity + catalog + commerce + fulfillment + engagement):
# API + outbox/email/notification/fulfillment workers + Mongo (replica set,
# required for outbox/cross-context transactions) + Redis (sessions/OTP/BullMQ).
#
# Worker Mongo needs: outbox/notification/fulfillment call bootstrap() → require MONGO_URI +
# the initialized replica set (mongo-init). email is Resend+Redis only (no Mongo).

services:
  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: mongosh --quiet --eval 'db.runCommand("ping").ok'
      interval: 5s
      timeout: 5s
      retries: 10

  mongo-init:
    image: mongo:7
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    entrypoint:
      - bash
      - -c
      - >
        mongosh --host mongo:27017 --quiet --eval
        'try { rs.status().ok } catch (e) { rs.initiate({_id: "rs0", members: [{ _id: 0, host: "mongo:27017" }]}) }'

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      MONGO_URI: mongodb://mongo:27017/flavorstack?replicaSet=rs0
      REDIS_HOST: redis
    ports:
      - "3000:3000"
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
    restart: unless-stopped

  worker-outbox:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file: .env
    environment:
      WORKER_TYPE: outbox
      MONGO_URI: mongodb://mongo:27017/flavorstack?replicaSet=rs0
      REDIS_HOST: redis
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
    restart: unless-stopped

  worker-email:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file: .env
    environment:
      WORKER_TYPE: email
      REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_started
    restart: unless-stopped

  worker-notification:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file: .env
    environment:
      WORKER_TYPE: notification
      # notification.worker calls bootstrap() (NotificationRepository + IdentityRecipientResolver +
      # email channel) → needs the replica-set Mongo, not just Redis.
      MONGO_URI: mongodb://mongo:27017/flavorstack?replicaSet=rs0
      REDIS_HOST: redis
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
    restart: unless-stopped

  worker-fulfillment:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file: .env
    environment:
      WORKER_TYPE: fulfillment
      # fulfillment.worker calls bootstrap() (FulfillmentJobHandler: assignment-/sla-timeout jobs)
      # → needs the replica-set Mongo.
      MONGO_URI: mongodb://mongo:27017/flavorstack?replicaSet=rs0
      REDIS_HOST: redis
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
    restart: unless-stopped

volumes:
  mongo-data:
  redis-data:
