# Phase 12, Batch 12.3 — production stack (SAME-ORIGIN topology).
#
# One public HTTPS origin (nginx :443) fronts EVERYTHING:
#   /              → my-app  (Next.js standalone, :3000 in-network)
#   /api/v1/*      → api     (:3000 in-network)
#   /socket.io/*   → api     (WS upgrade; the `/tracking` namespace)
#
# WHY same-origin: server_2's auth cookies are frozen at `sameSite:'lax'` +
# `secure` (cookies.ts). A separate FE domain would need `sameSite:'none'`,
# which is a backend change (out of scope). Serving FE + API under ONE origin
# makes the lax cookies "just work" and removes CORS entirely. See deploy/README.md.
#
# Bring up from the repo root:
#   docker compose -f deploy/docker-compose.prod.yml up -d --build
#
# NODE_ENV=production everywhere → server_2 cookies are flagged `Secure`
# (requires the real HTTPS edge nginx terminates).

services:
  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: mongosh --quiet --eval 'db.runCommand("ping").ok'
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
        reservations:
          memory: 256M

  # One-shot replica-set initiator. Mongo transactions/outbox require a replica
  # set in EVERY environment; gate `api`/workers on this completing.
  mongo-init:
    image: mongo:7
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    entrypoint:
      - bash
      - -c
      - >
        mongosh --host mongo:27017 --quiet --eval
        'try { rs.status().ok } catch (e) { rs.initiate({_id: "rs0", members: [{ _id: 0, host: "mongo:27017" }]}) }'

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  api:
    build:
      context: ../server_2
      dockerfile: Dockerfile.prod
    env_file: ../server_2/.env
    environment:
      NODE_ENV: production
      MONGO_URI: mongodb://mongo:27017/flavorstack?replicaSet=rs0
      REDIS_HOST: redis
      # Single public origin — same-origin in prod, so CORS is effectively moot,
      # but lock both HTTP CORS and the Socket.IO handshake to it regardless.
      ALLOWED_ORIGINS: ${PUBLIC_ORIGIN:-https://localhost}
      REALTIME_CORS_ORIGIN: ${PUBLIC_ORIGIN:-https://localhost}
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 256M

  # Phase 8: three worker services collapsed to two, matching the two queues. The healthcheck
  # is unchanged and deliberately worker-type-agnostic — it only proves the process is alive.
  worker-relay:
    build:
      context: ../server_2
      dockerfile: Dockerfile.worker
    env_file: ../server_2/.env
    environment:
      NODE_ENV: production
      WORKER_TYPE: relay
      MONGO_URI: mongodb://mongo:27017/flavorstack?replicaSet=rs0
      REDIS_HOST: redis
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f dist/workers/index.js >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # Unlike the worker-email it replaces, worker-jobs calls bootstrapWorker() and runs the
  # fulfillment timeout jobs — so it needs MONGO_URI and the mongo-init gate.
  worker-jobs:
    build:
      context: ../server_2
      dockerfile: Dockerfile.worker
    env_file: ../server_2/.env
    environment:
      NODE_ENV: production
      WORKER_TYPE: jobs
      MONGO_URI: mongodb://mongo:27017/flavorstack?replicaSet=rs0
      REDIS_HOST: redis
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f dist/workers/index.js >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  my-app:
    build:
      context: ../my-app
      dockerfile: Dockerfile
      args:
        # Same-origin prod config (inlined into the client bundle at build time).
        NEXT_PUBLIC_API_BASE_URL: /api/v1
        # Empty → same-origin: the `/tracking` socket connects to the page origin,
        # which nginx proxies to api with the WS upgrade headers.
        NEXT_PUBLIC_SOCKET_URL: ""
        # Live order tracking ON for prod (the Dockerfile default is false).
        NEXT_PUBLIC_FEATURE_TRACKING: "true"
    environment:
      NODE_ENV: production
      # Rewrite fallback only (nginx owns /api/v1 routing in prod).
      API_PROXY_TARGET: http://api:3000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # Next standalone root (redirects to /Home); wget follows and gets 200.
      # Use 127.0.0.1 (not localhost): Next binds IPv4 0.0.0.0 only, while the
      # container's /etc/hosts resolves localhost → ::1 first, so busybox wget
      # would hit IPv6 and get "connection refused".
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 512M
        reservations:
          memory: 256M

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      api:
        condition: service_healthy
      my-app:
        condition: service_healthy
    healthcheck:
      # Liveness only: busybox wget in nginx:alpine can't verify the self-signed
      # TLS edge, so check the master process is running. Use `pidof` — busybox
      # `pgrep -x` matches the FULL cmdline ("nginx: master process …"), not the
      # process name, so `pgrep -x nginx` never matches and flaps unhealthy.
      test: ["CMD-SHELL", "pidof nginx >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

volumes:
  mongo-data:
  redis-data:
