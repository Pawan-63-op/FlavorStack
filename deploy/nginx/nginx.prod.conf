# Phase 12, Batch 12.3 — single-origin reverse proxy (prod).
#
# Terminates TLS and serves the WHOLE app under ONE origin so server_2's frozen
# `sameSite:'lax'` + `secure` cookies work without any backend change:
#   /            → my-app  (Next.js standalone)
#   /api/v1/*    → api     (cookies + x-request-id passed UNTOUCHED)
#   /socket.io/* → api     (WebSocket Upgrade — the `/tracking` namespace)
#
# Because everything is one origin, NO CORS headers are needed (and the browser
# never issues a cross-origin request). Do not add Access-Control-* here.

# Map the Upgrade request header → Connection value for the WS handshake.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Edge rate-limit for auth endpoints (defence-in-depth ON TOP of server_2's Redis
# sliding-window limiter). Deliberately generous so it never throttles seeding or
# the concurrent verification; it only caps brute-force bursts per client IP.
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/s;

# Docker's embedded DNS, so upstreams resolve at request time (services may
# restart) rather than pinning an IP at config load.
# (Set inside each server below.)

# Plain HTTP → force HTTPS (Secure cookies require the TLS edge).
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:3000;
    set $app_upstream http://my-app:3000;

    # Reasonable upload ceiling (menu images go straight to Cloudinary, but keep
    # multipart room for any future form posts).
    client_max_body_size 10m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ── Security response headers ─────────────────────────────────────────────
    # Sent on every response (`always`, incl. errors). NO Access-Control-* by
    # design — this is a single same-origin app (see top-of-file note). Inherited
    # by every location that declares no add_header of its own; re-declared inside
    # /_next/static/ (which sets its own Cache-Control add_header, which would
    # otherwise drop these per nginx's add_header inheritance rule).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    limit_req_status 429;

    # ── Auth (same-origin) — same proxy behaviour + a generous edge rate limit ─
    location /api/v1/auth/ {
        limit_req zone=auth_limit burst=20 nodelay;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_pass_request_headers on;
    }

    # ── API (same-origin) ─────────────────────────────────────────────────────
    # Pass cookies and x-request-id UNTOUCHED so the FE ApiError → server Pino
    # log correlation (Phase 0 / Batch 12.4) holds end-to-end.
    location /api/v1/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_pass_request_headers on;
    }

    # ── Socket.IO (live tracking `/tracking`) ─────────────────────────────────
    # The WS upgrade handshake carries the first-party session cookie (same
    # origin), so it authenticates cleanly through socketAuth.
    location /socket.io/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── Next.js static assets (immutable, long-cache) ─────────────────────────
    location /_next/static/ {
        proxy_pass $app_upstream;
        proxy_set_header Host $host;
        proxy_cache_valid 200 60m;
        # This block declares add_header, so the server-level security headers are
        # NOT inherited here — re-declare them alongside Cache-Control.
        add_header Cache-Control             "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-Frame-Options           "SAMEORIGIN" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    }

    # ── Frontend (Next.js standalone) ─────────────────────────────────────────
    location / {
        proxy_pass $app_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Next's own HMR/websocket in dev is irrelevant here, but harmless.
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
    }
}
